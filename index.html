<style>
  :root {
    --bg: #0a0e14;
    --surface: #0d1117;
    --border: #1b2332;
    --prompt: #7ee787;
    --cmd: #79c0ff;
    --text: #c9d1d9;
    --muted: #6e7681;
    --accent: #f0883e;
    --pink: #d2a8ff;
    --cyan: #56d4dd;
    --red: #ff7b72;
    --yellow: #e3b341;
    --font: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { font-family: var(--font); color: var(--text); background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  a { color: inherit; text-decoration: none; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Boot screen */
  #boot { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; z-index: 100; transition: opacity 0.4s; }
  #boot.hidden { opacity: 0; pointer-events: none; }
  #boot .msg { color: var(--prompt); font-size: 15px; animation: blink 1s step-end infinite; }
  #boot .bar { color: var(--muted); font-size: 12px; }

  /* Title bar */
  .titlebar { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; background: var(--bg); }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 10px; height: 10px; border-radius: 50%; }
  .titlebar-text { color: var(--muted); font-size: 12px; flex: 1; text-align: center; }

  /* Nav */
  .nav { padding: 10px 16px; display: flex; gap: 8px; overflow-x: auto; border-bottom: 1px solid var(--border); position: sticky; top: 44px; z-index: 10; background: var(--bg); }
  .nav button { background: transparent; border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; color: var(--muted); font-size: 12px; font-family: var(--font); cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.2s; }
  .nav button.active { background: rgba(126,231,135,0.08); border-color: rgba(126,231,135,0.27); color: var(--prompt); }

  /* Body */
  .body { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

  /* Prompt */
  .prompt-line { display: flex; gap: 8px; font-size: 13px; line-height: 1.6; }
  .prompt-char { color: var(--prompt); flex-shrink: 0; }
  .prompt-cmd { color: var(--cmd); }
  .cursor { animation: blink 1s step-end infinite; }

  /* Section content */
  .section { animation: fadeUp 0.35s ease both; }
  .section-body { margin-top: 10px; padding-left: 2px; }

  /* About */
  .about { font-size: 13px; line-height: 1.8; }
  .about h2 { color: var(--pink); font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .about p { color: var(--muted); margin-bottom: 14px; }
  .about a { color: var(--accent); }
  .badges { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .badge { border-radius: 6px; padding: 10px 14px; text-align: center; flex: 1 1 80px; min-width: 80px; }
  .badge .city { font-size: 16px; font-weight: 700; }
  .badge .years { color: var(--muted); font-size: 10px; margin-top: 2px; }

  /* Photos */
  .photo-filters { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; }
  .photo-filters button { background: transparent; border: 1px solid var(--border); border-radius: 14px; padding: 4px 12px; color: var(--muted); font-size: 11px; font-family: var(--font); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .photo-filters button.active { background: rgba(86,212,221,0.13); border-color: rgba(86,212,221,0.38); color: var(--cyan); }
  .photo-grid { display: flex; flex-direction: column; gap: 3px; }
  .photo-item { display: block; position: relative; width: 100%; }
  .photo-item img { width: 100%; display: block; object-fit: cover; background: var(--surface); min-height: 200px; }
  .photo-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px 14px 12px; background: linear-gradient(transparent, rgba(0,0,0,0.75)); display: flex; justify-content: space-between; align-items: flex-end; }
  .photo-label { color: #fff; font-size: 13px; font-weight: 600; }
  .photo-cat { color: var(--cyan); font-size: 10px; background: rgba(86,212,221,0.15); padding: 2px 8px; border-radius: 10px; }
  .photo-link { text-align: center; padding: 16px 0 4px; font-size: 12px; }
  .photo-link a { color: var(--accent); }

  /* Games */
  .game-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .game-inner { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .game-head { display: flex; align-items: center; gap: 10px; }
  .game-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .game-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .game-genre { font-size: 11px; color: var(--muted); }
  .game-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .game-actions { display: flex; gap: 8px; margin-top: 4px; }
  .game-play { flex: 1; border-radius: 6px; padding: 10px 0; font-size: 12px; font-family: var(--font); cursor: pointer; }
  .game-link { padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 12px; display: flex; align-items: center; }
  .game-embed { border-top: 1px solid var(--border); background: #000; padding: 8px; }
  .game-embed iframe { width: 100%; height: 167px; border: none; border-radius: 6px; }

  /* Skills */
  .skill-cat { color: var(--pink); margin-bottom: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; }
  .skill-group { margin-bottom: 16px; }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .skill-tag { background: rgba(121,192,255,0.07); border: 1px solid rgba(121,192,255,0.16); color: var(--cmd); padding: 4px 10px; border-radius: 4px; font-size: 11px; }

  /* Contact */
  .contact-link { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
  .contact-label { color: var(--accent); min-width: 62px; font-size: 12px; }
  .contact-value { word-break: break-all; font-size: 12px; }

  /* Input */
  .input-line { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-top: 8px; }
  .input-line input { flex: 1; background: transparent; border: none; outline: none; color: var(--cmd); font-size: 13px; font-family: var(--font); caret-color: var(--prompt); }

  /* Footer */
  .footer { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 10px; color: var(--muted); background: var(--bg); display: flex; justify-content: space-between; }

  /* ASCII */
  .ascii { color: var(--cyan); margin-bottom: 6px; font-size: 11px; line-height: 1.4; white-space: pre; }
</style>
</head>

function renderSection(key) {
  const renderers = { about: renderAbout, it: renderIT, photos: renderPhotos, games: renderGames, skills: renderSkills, contact: renderContact };
  return renderers[key] ? renderers[key]() : '';
}

// -- State management --
function render() {
  const container = document.getElementById('sections');
  container.innerHTML = state.history.map((key, i) => `
    <div class="section" id="section-${key}">
      <div class="prompt-line">
        <span class="prompt-char">❯</span>
        <span class="prompt-cmd">${SECTIONS[key].cmd}</span>
      </div>
      <div class="section-body">${renderSection(key)}</div>
    </div>`).join('');

  // Update nav
  document.querySelectorAll('.nav button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === state.active);
  });

  // Scroll active section's prompt line to just below the sticky header
  setTimeout(() => {
    const el = document.getElementById('section-' + state.active);
    if (el) {
      const headerOffset = 100; // titlebar + nav height
      const top = el.getBoundingClientRect().top + window.pageYOffset - headerOffset;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  }, 50);
}

function navigate(key) {
  if (state.typing || !SECTIONS[key]) return;
  state.typing = true;
  state.active = key;
  state.history = [...state.history.filter(h => h !== key), key];
  state.expandedGame = null;
  render();
  setTimeout(() => { state.typing = false; }, 300);
}

function setPhotoFilter(cat) {
  state.photoFilter = cat;
  render();
}

function toggleGame(i) {
  state.expandedGame = state.expandedGame === i ? null : i;
  render();
}

// -- Init --
document.getElementById('date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

// Build nav
const nav = document.getElementById('nav');
Object.entries(SECTIONS).forEach(([key, sec]) => {
  const btn = document.createElement('button');
  btn.dataset.key = key;
  btn.innerHTML = `<span style="margin-right:5px;font-size:11px">${sec.icon}</span>${sec.label}`;
  btn.onclick = () => navigate(key);
  if (key === 'about') btn.classList.add('active');
  nav.appendChild(btn);
});

// Input
document.getElementById('cmd-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    const val = e.target.value.trim().toLowerCase();
    const match = Object.keys(ALIASES).find(k => ALIASES[k].some(a => val === a || val.includes(a)));
    if (match) navigate(match);
    else if (val === 'clear') { state.history = [state.active]; render(); }
    e.target.value = '';
  }
});

// Boot sequence
setTimeout(() => {
  document.getElementById('boot').classList.add('hidden');
  render();
}, 1600);
